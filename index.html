<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life & Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--surface:#F6F5F4;--raise:#FFFFFF;--line:#E8E5E1;--line2:#D8D3CD;
  --ink:#18171C;--mute:#6B6770;--red:#C8102E;--red-ink:#A50D26;--red-soft:#FCECEF;
  --gold:#9C6C12;--gold-fill:#D4A23A;--gold-soft:#FBF3E2;--ok:#1E8A4C;--ok-soft:#E7F5EC;
  --track:#EFECE8;--shade:0 18px 48px rgba(24,23,28,.18);
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141316;--surface:#1C1B1F;--raise:#222126;--line:#2F2D33;--line2:#3C3941;
  --ink:#F3F1EE;--mute:#A7A2AA;--red:#F0465E;--red-ink:#FF7387;--red-soft:#3A1B22;
  --gold:#E6B758;--gold-fill:#D4A23A;--gold-soft:#342A18;--ok:#47C27D;--ok-soft:#183324;
  --track:#2B292F;--shade:0 18px 48px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141316;--surface:#1C1B1F;--raise:#222126;--line:#2F2D33;--line2:#3C3941;
  --ink:#F3F1EE;--mute:#A7A2AA;--red:#F0465E;--red-ink:#FF7387;--red-soft:#3A1B22;
  --gold:#E6B758;--gold-fill:#D4A23A;--gold-soft:#342A18;--ok:#47C27D;--ok-soft:#183324;
  --track:#2B292F;--shade:0 18px 48px rgba(0,0,0,.5);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-weight:700}
h2{font:700 19px/1.2 var(--cond);letter-spacing:.01em}
h3{font:600 15px/1.3 var(--body)}
p{margin:0}
.mu{color:var(--mute)}.sm{font-size:13px}.xs{font-size:12px}
.num{font-family:var(--cond);font-variant-numeric:tabular-nums;font-weight:700}
.gold{color:var(--gold)}.red{color:var(--red)}.ok{color:var(--ok)}

/* Shell */
.shell{max-width:1120px;margin:0 auto;padding:16px 20px 40px}
.top{display:flex;align-items:center;gap:12px;padding:4px 0 14px}
.brand{display:flex;align-items:center;gap:10px;font:800 22px/1 var(--cond);letter-spacing:.01em}
.brand i{width:12px;height:26px;background:var(--red);border-radius:2px;box-shadow:5px 0 0 var(--gold-fill)}
.top .grow{flex:1}
.nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.nav button{all:unset;cursor:pointer;padding:10px 14px 12px;font:600 15px var(--body);color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.nav button svg{width:18px;height:18px}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--ink);border-bottom-color:var(--red)}
.nav button:focus-visible{outline:2px solid var(--red);outline-offset:-2px;border-radius:6px}

/* Controls */
button,input,select,textarea{font:inherit;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;background:var(--red);color:#fff;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--red-ink)}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--ink)}
.btn.ghost:hover{background:var(--surface)}
.btn.quiet{background:transparent;color:var(--mute);border-color:transparent;padding:0 10px}
.btn.quiet:hover{color:var(--ink);background:var(--surface)}
.btn.danger{background:transparent;border-color:var(--line2);color:var(--red)}
.btn.danger:hover{background:var(--red-soft)}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.icon{width:40px;padding:0}
.btn.icon.sm{width:32px}
.btn svg{width:18px;height:18px}
:is(.btn,input,select,textarea,summary):focus-visible{outline:2px solid var(--red);outline-offset:2px}
input,select,textarea{background:var(--raise);border:1px solid var(--line2);border-radius:10px;min-height:40px;padding:0 12px;max-width:100%}
input[type=number]{width:88px;font-variant-numeric:tabular-nums}
input[type=time]{width:120px}
input[type=date]{width:160px}
textarea{width:100%;padding:10px 12px;min-height:90px;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.8}
input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:0;accent-color:var(--red);margin:0;flex:none}
select{padding-right:8px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:7px;font:600 13px var(--body);color:var(--mute)}
.seg button.on{background:var(--raise);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.seg button:focus-visible{outline:2px solid var(--red)}

/* Layout */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.stack{display:grid;gap:12px}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.cols3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));align-items:start}
.panel{background:var(--raise);border:1px solid var(--line);border-radius:16px;padding:20px}
.panel.flat{background:var(--surface);border-color:transparent}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-h h2{flex:1}
.section{margin-top:28px}
.section>h2{margin-bottom:12px}
.empty{padding:18px;border:1px dashed var(--line2);border-radius:12px;color:var(--mute);text-align:center}
.field{display:grid;gap:6px}
.field>span{font-size:13px;color:var(--mute);font-weight:500}
.unit{color:var(--mute);font-size:13px}

/* Datebar */
.datebar{display:flex;align-items:center;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.datebar .when{position:relative;display:flex;align-items:center;gap:8px;font:700 22px/1 var(--cond);padding:6px 10px;border-radius:10px;cursor:pointer}
.datebar .when:hover{background:var(--surface)}
.datebar .when input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;min-height:0}

/* Hero (today) */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding:24px;border-radius:20px;background:var(--raise);border:1px solid var(--line);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--red)}
.hero .title{font:700 30px/1.1 var(--cond);border:0;background:transparent;padding:0;min-height:0;width:100%;border-radius:6px}
.hero .title:hover{background:var(--surface)}
.hero .meta{margin-top:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.score{text-align:right;min-width:220px}
.score .big{font:800 84px/.85 var(--cond);color:var(--red);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.score .big small{font-size:38px;margin-left:2px}
.score .lbl{font-weight:600;margin-top:6px}
.meter{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin:10px 0 8px}
.meter i{display:block;height:100%;background:var(--gold-fill);border-radius:99px;transition:width .3s}

/* Metric tiles */
.tiles{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));margin-top:16px}
.tiles.four{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tile .field input[type=text]{width:100%}
.inl{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.inl>span:first-child{color:var(--mute);font-size:14px}
.tile{background:var(--raise);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.tile-h{display:flex;align-items:center;gap:8px}
.tile-h h3{flex:1}
.tile .val{display:flex;align-items:baseline;gap:6px}
.tile .val b{font:700 34px/1 var(--cond);font-variant-numeric:tabular-nums}
.tile .val span{color:var(--mute);font-size:14px}
.bar{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .3s}
.bar i.full{background:var(--gold-fill)}
.bar i.over{background:var(--red-ink)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--surface);color:var(--mute)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.red{background:var(--red-soft);color:var(--red)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.kv b{font-variant-numeric:tabular-nums}
.macro{display:grid;gap:4px}
.macro .kv span:first-child{color:var(--mute)}
.sleepgrid{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.sleepgrid label{font-size:13.5px;color:var(--mute)}
.hm{display:flex;align-items:center;gap:6px}
.hm input{width:62px}
.quick{display:flex;gap:6px;flex-wrap:wrap}

/* Tasks */
.task{display:flex;align-items:center;gap:12px;padding:12px 4px 12px 12px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .cat{width:4px;align-self:stretch;border-radius:4px;flex:none}
.task .tt{flex:1;min-width:0}
.task .tt b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.task .tt span{font-size:13px;color:var(--mute)}
.task.done .tt b{text-decoration:line-through;color:var(--mute)}
.task .time{font:600 15px var(--cond);font-variant-numeric:tabular-nums;min-width:86px}
.habit{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.habit:last-of-type{border-bottom:0}
.habit label{flex:1;display:flex;gap:12px;align-items:center;cursor:pointer}

/* Nutrition */
.adder{position:relative}
.search{position:relative}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search input{width:100%;min-height:48px;font-size:16px;padding-left:42px}
.search svg{position:absolute;left:13px;top:14px;width:20px;height:20px;color:var(--mute);pointer-events:none}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--raise);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shade);max-height:340px;overflow:auto;z-index:20;padding:6px}
.res{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:8px;cursor:pointer}
.res:hover,.res.act{background:var(--surface)}
.res b{font-weight:600}
.res span{font-size:12.5px;color:var(--mute);white-space:nowrap}
.res mark{background:none;color:var(--red);font-weight:700}
.resh{font-size:12px;color:var(--mute);padding:8px 12px 4px}
.addrow{display:grid;grid-template-columns:110px 1fr 1fr auto;gap:10px;margin-top:12px;align-items:end}
.addrow input,.addrow select{width:100%}
.preview{margin-top:12px;padding:10px 14px;background:var(--surface);border-radius:10px;font-size:14px;display:flex;gap:14px;flex-wrap:wrap}
.preview b{font-variant-numeric:tabular-nums}
.slot h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}
.slot h3 span{font:500 13px var(--body);color:var(--mute)}
.item{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);background:var(--raise)}
.item .nm{flex:1;min-width:0}
.item .q{display:flex;gap:6px;flex-wrap:wrap;align-items:center;order:3;width:100%;padding-left:24px}
.item .del{margin-left:auto}
.slot.slot-over{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red);background:var(--red-soft)}
input.tm{width:92px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
input.du{width:84px;font-variant-numeric:tabular-nums}
.item:last-child{border-bottom:0}
.item .nm{min-width:0}
.item .nm b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .nm span{font-size:12.5px;color:var(--mute)}
.item input{width:76px;min-height:36px}
.item select{min-height:36px;width:auto}
details.more{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
details.more summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+";display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--surface);font-weight:700}
details.more[open] summary::before{content:"–"}
.formgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-top:12px}
.formgrid input,.formgrid select{width:100%}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--mute);font-size:12.5px;text-align:left;padding:8px 8px 8px 0;border-bottom:1px solid var(--line2)}
td{padding:10px 8px 10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;padding-right:0}
.tbl{overflow-x:auto}
.pct{display:inline-block;min-width:52px;text-align:right;font-weight:700}

/* Stats grid */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--raise);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{padding:14px 16px;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.chart svg{display:block;width:100%;max-height:270px}
.stat b{display:block;font:700 26px/1.1 var(--cond);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mute)}

/* Week calendar */
.calwrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--raise)}
.gcal{min-width:760px}
.ghead{display:grid;grid-template-columns:48px repeat(7,1fr);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--raise);z-index:3}
.ghead div{padding:10px 4px;text-align:center;font:600 14px var(--body)}
.ghead div.today{color:var(--red)}
.ghead div small{display:block;font:700 20px/1 var(--cond);color:var(--ink)}
.ghead div.today small{color:var(--red)}
.gbody{display:grid;grid-template-columns:48px repeat(7,1fr);max-height:620px;overflow-y:auto}
.gcol{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 44px)}
.gcol.today{background-color:color-mix(in srgb,var(--red) 4%,transparent)}
.gcol.hover{background-color:color-mix(in srgb,var(--gold-fill) 14%,transparent)}
.ev{position:absolute;border-radius:7px;padding:3px 6px;font-size:11.5px;line-height:1.25;color:#fff;overflow:hidden;cursor:grab;border:1px solid var(--raise);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.ev.d{opacity:.45}
.ev b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.dragging{z-index:10;box-shadow:var(--shade);cursor:grabbing;opacity:.92}
.hl{position:absolute;right:6px;font-size:11px;color:var(--mute)}

/* Month */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:12.5px;color:var(--mute);font-weight:600;padding:0 4px}
.cal button{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border-radius:10px;min-height:88px;padding:6px;display:flex;flex-direction:column;gap:3px;border:1px solid transparent}
.cal button:hover{border-color:var(--line2)}
.cal button:focus-visible{outline:2px solid var(--red)}
.cal button.today{border-color:var(--red)}
.cal button>b{font:700 16px var(--cond)}
.bdg{display:block;border-radius:5px;padding:1px 5px;font-size:10.5px;line-height:15px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Training */
.ex{padding:16px 0;border-top:1px solid var(--line)}
.ex-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex-h b{flex:1;min-width:160px;font-size:16px}
.set{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.set .n{min-width:56px;font-size:13px;color:var(--mute)}
.set input{width:86px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 6px 4px 10px;border-radius:99px;background:var(--surface);font-size:13px}
.chip button{all:unset;cursor:pointer;width:20px;height:20px;display:grid;place-items:center;border-radius:99px;color:var(--mute)}
.chip button:hover{background:var(--line);color:var(--ink)}

/* Séances : outils, exercices */
.dlg-top{display:flex;align-items:flex-start;gap:10px}.dlg-top h2{flex:1}
.btn:disabled{opacity:.3;cursor:default;background:transparent}
.sess-tools{gap:8px}
.exlist .ex:first-child{border-top:1px solid var(--line)}
.ex{background:var(--raise)}
.ex-h b{min-width:120px}
.ex-tools{display:flex;gap:2px;align-items:center}
.grip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--mute);font-weight:700;letter-spacing:-2px;padding:6px 6px 6px 0;font-size:16px;line-height:1}
.grip:hover{color:var(--ink)}
.ex-opts{margin-top:8px;gap:12px}
.uni{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mute);cursor:pointer}
.uni input{width:18px;height:18px}
.ex-drag{position:relative;z-index:6;box-shadow:var(--shade);border-radius:12px;opacity:.96;cursor:grabbing}
.drop-before{box-shadow:inset 0 3px 0 var(--red)}
.drop-after{box-shadow:inset 0 -3px 0 var(--red)}
/* Séances repliables */
.sess-closed{padding:0;margin-bottom:8px;overflow:hidden}
.sess-row{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:14px 18px;min-height:56px}
.sess-row:hover{background:var(--surface)}
.sess-row:focus-visible{outline:2px solid var(--red);outline-offset:-2px;border-radius:16px}
.sess-sum{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.sess-sum b{font-weight:700}
.chev svg{width:18px;height:18px;transition:transform .2s;display:block}
.sess-row .chev{color:var(--mute);flex:none}
.chev.open svg{transform:rotate(180deg)}
.sess-title{cursor:pointer}
/* Goals & guide */
.goal{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.goal:last-of-type{border-bottom:0}
.goal input{width:100%}
.goal .t{font-weight:700}
.goal.now{position:relative}
.goal.now::before{content:"";position:absolute;left:-20px;top:14px;bottom:14px;width:4px;border-radius:4px;background:var(--gold-fill)}
.bullet{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.bullet textarea{min-height:44px;flex:1}

/* Sync */
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mute);margin-right:4px}
.sync i{width:8px;height:8px;border-radius:99px;background:var(--line2)}
.sync.ok i{background:var(--ok)}.sync.gold i{background:var(--gold-fill)}.sync.red i{background:var(--red)}
/* Exercise picker */
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchips button{all:unset;cursor:pointer;padding:6px 12px;border-radius:99px;background:var(--surface);font:600 13px var(--body);color:var(--mute);border:1px solid var(--line)}
.fchips button.on{background:var(--red);border-color:var(--red);color:#fff}
.fchips button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.pklist{margin-top:12px;max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px}

/* Dialog */
dialog{background:var(--raise);color:var(--ink);border:1px solid var(--line);border-radius:18px;width:min(480px,94vw);padding:22px;box-shadow:var(--shade)}
dialog::backdrop{background:rgba(10,10,12,.5)}
dialog h2{margin-bottom:6px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:flex;align-items:center;justify-content:center;width:40px;height:36px;border-radius:8px;border:1px solid var(--line2);cursor:pointer;font-size:13px;font-weight:600}
.days input{position:absolute;opacity:0;pointer-events:none}
.days label:has(input:checked){background:var(--red);border-color:var(--red);color:#fff}
.days label:has(input:focus-visible){outline:2px solid var(--red);outline-offset:2px}
.radio{display:flex;gap:8px;align-items:center;cursor:pointer}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:100;box-shadow:var(--shade);max-width:90vw}

/* Mobile */
@media (max-width:760px){
  .shell{padding:12px 14px calc(92px + env(safe-area-inset-bottom,0px))}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:50;margin:0;border:0;border-top:1px solid var(--line);background:var(--raise);justify-content:space-around;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));gap:0}
  .nav button{flex-direction:column;gap:3px;font-size:11px;padding:7px 4px;border:0;flex:1;justify-content:center;align-items:center;border-radius:10px}
  .nav button svg{width:22px;height:22px}
  .nav button.on{color:var(--red);border:0}
  .hero{grid-template-columns:1fr;padding:20px;gap:14px}
  .score{text-align:left;min-width:0}
  .score .big{font-size:68px}
  .hero .title{font-size:26px}
  .panel{padding:16px}
  .tile{padding:16px}
  .addrow{grid-template-columns:1fr 1fr}
  .addrow .btn{grid-column:1/-1}

  .top .lbl{display:none}
  .brand{font-size:19px;white-space:nowrap}
  .pklist .res,.results .res{flex-direction:column;align-items:flex-start;gap:2px}
  .res span{white-space:normal}
  .fchips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .fchips button{white-space:nowrap}
  dialog{padding:18px}
  .sess-row{padding:12px 14px;gap:8px;min-height:52px}
  .sess-sum{font-size:14px}
  .tiles.four{grid-template-columns:1fr 1fr;gap:10px}
  .tiles.four .tile{padding:12px 14px;gap:6px;border-radius:14px}
  .tiles.four .val b{font-size:26px}
  .tiles.four .tile-h .pill{display:none}
  input,select,textarea{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function exMode(n){const x=exInfo(n);if(x)return x.mode;return /traction|dips|pompe|burpee/i.test(n)?'lest':/dead hang|l-sit|gainage|planche|plank|hold|skierg|rameur|bike|course/i.test(n)?'temps':'charge'}

function blankSet(m){return m=='temps'?{t:0,l:0}:m=='lest'?{l:0,pdc:true,r:0}:{w:0,r:0}}
function SX(n,mode,sets,note){return{n,mode,sets,note:note||''}}
function migEx(e){if(e.sets)return;e.mode=exMode(e.n);e.sets=[];let lw=0;const num=v=>+String(v).replace(',','.').replace('+','');
  String(e.s||'').split(',').map(z=>z.trim()).filter(Boolean).forEach(tk=>{const m=tk.match(/^(\+?-?\d+(?:[.,]\d+)?)\s*(?:kg)?\s*[x×]\s*(\d+)/i);
    if(m){lw=num(m[1]);const r=+m[2];if(e.mode=='lest')e.sets.push({l:lw,pdc:!lw,r});else if(e.mode=='temps')e.sets.push({t:r,l:lw});else e.sets.push({w:lw,r})}
    else{const n=num(tk);if(isNaN(n))return;if(e.mode=='temps')e.sets.push({t:n,l:0});else if(e.mode=='lest')e.sets.push({l:lw,pdc:!lw,r:n});else e.sets.push({w:lw,r:n})}});
  if(!e.sets.length)e.sets.push(blankSet(e.mode));delete e.s;delete e.push}
function convSet(st,m){const l=st.l??st.w??0;return m=='lest'?{l,pdc:!l,r:st.r||0}:m=='temps'?{t:st.t||0,l:st.l||0}:{w:st.w??st.l??0,r:st.r||0}}
function lbl(e,st){return e.mode=='lest'?(st.pdc||!st.l?'PDC':'+'+fnum(st.l)+' kg'):e.mode=='charge'?fnum(st.w)+' kg':''}
function fmtList(e){if(e.mode=='temps')return e.sets.map(st=>fnum(st.t)+' s'+(st.l?' (+'+fnum(st.l)+' kg)':'')).join(', ');const g=[];e.sets.forEach(st=>{const b=lbl(e,st),L=g[g.length-1];if(L&&L[0]==b)L[1].push(st.r);else g.push([b,[st.r]])});return g.map(a=>a[0]+' × '+a[1].join(', ')).join(' · ')}
function exSum(e){if(!e.sets.length)return'';const X=e.sets,U=e.uni?2:1,US=e.uni?' (×2 côtés)':'';
  if(e.mode=='charge'){const v=U*sum(X.map(x=>(+x.w||0)*(+x.r||0))),R=U*sum(X.map(x=>+x.r||0)),b=X.reduce((a,x)=>(x.w>a.w||(x.w==a.w&&x.r>a.r))?x:a,X[0]);return`Volume <b>${nf(v)} kg</b>${US} · meilleure série <b>${fnum(b.w)} kg × ${b.r}</b>${e.uni?' / côté':''} · ${R} reps`}
  if(e.mode=='lest'){const R=U*sum(X.map(x=>+x.r||0)),w=x=>x.pdc?0:+x.l||0,b=X.reduce((a,x)=>(w(x)>w(a)||(w(x)==w(a)&&x.r>a.r))?x:a,X[0]);return`Total <b>${R} reps</b>${US} · meilleure série <b>${lbl(e,b)} × ${b.r}</b>${e.uni?' / côté':''}`}
  const T=sum(X.map(x=>+x.t||0)),b=X.reduce((a,x)=>x.t>a.t?x:a,X[0]);return`Total <b>${fnum(T)} s</b> · meilleure <b>${fnum(b.t)} s</b>`}
function statEx(e){const X=e.sets,U=e.uni?2:1;if(e.mode=='charge')return{max:Math.max(0,...X.map(x=>+x.w||0)),vol:U*sum(X.map(x=>(+x.w||0)*(+x.r||0)))};if(e.mode=='lest')return{max:Math.max(0,...X.map(x=>x.pdc?0:+x.l||0)),vol:U*sum(X.map(x=>+x.r||0))};return{max:Math.max(0,...X.map(x=>+x.t||0)),vol:sum(X.map(x=>+x.t||0))}}
function lastPerf(se,e){const pv=[...S.sessions].filter(z=>z.date<se.date&&z.ex.some(x=>x.n==e.n)).sort((a,b)=>b.date.localeCompare(a.date))[0];if(!pv)return'';const pe=pv.ex.find(x=>x.n==e.n);return pe.sets.length?`Dernière fois (${dS(pv.date)}) : ${fmtList(pe)}`:''}

function gymStats(a,b){const r={sess:0,vol:0,sets:0,reps:0,pec:{RAS:0,Vigilance:0,'Gêne':0}};S.sessions.filter(z=>z.date>=a&&z.date<=b).forEach(z=>{r.sess++;r.pec[z.pec||'RAS']=(r.pec[z.pec||'RAS']||0)+1;z.ex.forEach(e=>{const U=e.uni?2:1;r.sets+=e.sets.length;e.sets.forEach(s=>{r.reps+=U*(+s.r||0);if(e.mode=='charge')r.vol+=U*(+s.w||0)*(+s.r||0);else if(e.mode=='lest')r.vol+=U*((bwAt(z.date)||0)+(s.pdc?0:+s.l||0))*(+s.r||0)})})});return r}

const FK=['id','data-f','data-du','data-g','data-gu','data-gs','data-st','data-ex','data-sx','data-h','data-ck','data-tg','data-gl','data-gb','data-gt','data-md','data-ce'];
function focusKey(el){if(!el||el===document.body||!el.closest||!el.closest('#app'))return null;for(const a of FK){const v=el.getAttribute(a);if(v!=null&&v!=='')return a=='id'?'#'+CSS.escape(v):`[${a}="${CSS.escape(v)}"]`}return null}
function renderKeep(){setTimeout(()=>{const k=focusKey(document.activeElement);render();if(k){const el=document.querySelector('#app '+k);if(el){el.focus({preventScroll:true});if(el.matches('input[type=text],input[type=number],.tm,.du'))try{el.select()}catch(x){}}}},0)}
document.addEventListener('change',e=>{const t=e.target,d=t.dataset,l=lg(cur);
  if(t.matches('[data-tm]')){const v=parseTime(t.value);if(v===null){toast('Heure invalide : tape par exemple 930, 2330 ou 7h15.');t.value=d.f?(getPath(l,d.f)||''):'';return}t.value=v;if(!d.f)return}
  if(t.matches('[data-nav]')){if(t.value){cur=t.value}}
  else if(d.du){const m=parseDur(t.value);if(m===null||m>24*60){toast('Durée invalide : tape par exemple 116 (1 h 16) ou 45 (45 min).');t.value=durTxt(l.sl[d.du]);return}l.sl[d.du]={h:Math.floor(m/60),m:m%60}}
  else if(d.gs!==undefined)l.m[+d.gs].s=+t.value
  else if(d.f){const p=d.f.split('.'),v=t.type=='number'?(t.value===''?'':+t.value):t.value;let o=l;p.slice(0,-1).forEach(k=>o=o[k]=o[k]||{});o[p[p.length-1]]=v}
  else if(d.ck){const x=S.tasks.find(z=>z.id==d.ck);x.done[d.d]=t.checked}
  else if(d.h!==undefined)l.h[d.h]=t.checked;
  else if(d.g!==undefined)l.m[+d.g].q=+t.value||0;
  else if(d.gu!==undefined){const it=l.m[+d.gu],f=food(it.n),g=amt(it,f);it.u=t.value;it.q=r1(g/ufac(it.u,f))}
  else if(d.tg){const p=d.tg.split('.');if(p.length==2)return;if(p.length==2)S.tg[p[0]][p[1]]=+t.value||0;else S.tg[p[0]]=+t.value||0}
  else if(d.ce!==undefined)chEx=t.value;
  else if(d.st){const[id,i,j,f]=d.st.split('|'),ex=sess(id).ex[+i];ex.sets[+j][f]=+t.value||0;save();const el=document.getElementById('sm'+id+'_'+i);if(el)el.innerHTML=exSum(ex);return}
  else if(d.md){const[id,i]=d.md.split('|'),ex=sess(id).ex[+i];ex.mode=t.value;ex.sets=ex.sets.map(x=>convSet(x,t.value));if(!ex.sets.length)ex.sets.push(blankSet(t.value))}
  else if(d.ex){const[id,i,k]=d.ex.split('|');sess(id).ex[+i][k]=t.value;save();return}
  else if(d.sx){const[id,k]=d.sx.split('|');sess(id)[k]=t.value;if(k=='note'){save();return}}
  else if(d.gb){const[i,j]=d.gb.split('|');S.guides[+i].b[+j]=t.value;save();return}
  else if(d.gt)S.guides[+d.gt].t=t.value;
  else if(d.gl){const[i,k]=d.gl.split('|');S.goals[+i][k]=t.value}
  else if(t.id=='k_c'){$('#k_spw').hidden=t.value!='sport';return}
  else if(t.id=='k_r'){$('#k_days').hidden=!t.checked;return}
  else if(t.id=='fun'){addUnit=t.value;$('#fqt').value=pick?defQty(addUnit):'';preview();return}
  else if(t.id=='fsl'){addSlot=+t.value;return}
  else if(t.id=='pke'){pk.e=t.value;pkRender();return}
  else return;
  renderKeep()});

    else if(e.key=='Enter'){e.preventDefault();if(items[resIdx])choose(items[resIdx].dataset.n);else if(pick)$('#fqt').focus()}
    else if(e.key=='Escape'&&box)box.hidden=true}
  else if(t.id=='fqt'&&e.key=='Enter'){e.preventDefault();ACT.addf({},lg(cur))}
  else if(t.id=='pkq'&&e.key=='Enter'){e.preventDefault();const f=$('#pkres .res');if(f)f.click()}
  else if(t.id=='nh'&&e.key=='Enter'){e.preventDefault();if(ACT.addhab()!=='x')render()}
  else if(t.matches('.ev')&&(e.key=='Enter'||e.key==' ')){e.preventDefault();openEv(t.dataset.id,t.dataset.d)}
  else if(t.tagName=='INPUT'&&t.type!='search'&&e.key=='Enter'&&(t.dataset.f||t.dataset.du||t.dataset.g!==undefined||t.dataset.st))t.blur()});

/* ===== Glisser-déposer du calendrier (souris + tactile) ===== */
let drag=null,dragEnd=0;
function colAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('[data-col]'):null}
function startDrag(){if(!drag)return;drag.active=true;drag.el.classList.add('dragging');drag.el.style.pointerEvents='none';if(navigator.vibrate)try{navigator.vibrate(10)}catch(x){}}
document.addEventListener('pointerdown',e=>{const ev=e.target.closest('.ev');if(!ev||e.button>0)return;const r=ev.getBoundingClientRect();drag={el:ev,id:ev.dataset.id,from:ev.dataset.d,offY:e.clientY-r.top,x0:e.clientX,y0:e.clientY,active:false,touch:e.pointerType!='mouse',timer:null,col:null};if(drag.touch)drag.timer=setTimeout(startDrag,320)});
document.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0,dist=Math.hypot(dx,dy);
  if(!drag.active){if(drag.touch){if(dist>8){clearTimeout(drag.timer);drag=null}return}if(dist>5)startDrag();else return}
  drag.el.style.transform=`translate(${dx}px,${dy}px)`;const c=colAt(e.clientX,e.clientY);if(c!==drag.col){if(drag.col)drag.col.classList.remove('hover');drag.col=c;if(c)c.classList.add('hover')}});
document.addEventListener('touchmove',e=>{if((drag&&drag.active)||exDrag||fDrag)e.preventDefault()},{passive:false});
/* Glisser un aliment vers un autre repas (poignée ⋮⋮) */
let fDrag=null;
document.addEventListener('pointerdown',e=>{const g=e.target.closest('.fgrip');if(!g)return;const it=g.closest('.item');e.preventDefault();fDrag={it,ix:+it.dataset.ix,x0:e.clientX,y0:e.clientY,over:null};it.classList.add('ex-drag');it.style.pointerEvents='none';try{g.setPointerCapture(e.pointerId)}catch(x){}});
document.addEventListener('pointermove',e=>{if(!fDrag)return;const d=fDrag;d.it.style.transform=`translate(${e.clientX-d.x0}px,${e.clientY-d.y0}px)`;const el=document.elementFromPoint(e.clientX,e.clientY),sl=el&&el.closest?el.closest('[data-slot]'):null;if(sl!==d.over){if(d.over)d.over.classList.remove('slot-over');d.over=sl;if(sl)sl.classList.add('slot-over')}});
function endFDrag(cancel){if(!fDrag)return;const d=fDrag;fDrag=null;if(d.over)d.over.classList.remove('slot-over');d.it.style.transform='';d.it.style.pointerEvents='';d.it.classList.remove('ex-drag');
  if(!cancel&&d.over){const l=lg(cur),it=l.m[d.ix],to=+d.over.dataset.slot;if(it&&it.s!==to){it.s=to;toast(it.n+' → '+SLOTS[to]);render()}}}
document.addEventListener('pointerup',()=>endFDrag(false));
document.addEventListener('pointercancel',()=>endFDrag(true));
/* Fermeture des fenêtres au clic à l’extérieur */
dlg.addEventListener('click',e=>{if(e.target!==dlg)return;const r=dlg.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dlg.close()});
/* Glisser-déposer des exercices via la poignée ⋮⋮ */
let exDrag=null;
document.addEventListener('pointerdown',e=>{const g=e.target.closest('.grip');if(!g)return;const ex=g.closest('.ex');if(!ex)return;e.preventDefault();
  exDrag={ex,sid:ex.dataset.sid,i:+ex.dataset.i,j:+ex.dataset.i,y0:e.clientY,list:[...ex.parentElement.querySelectorAll('.ex')]};ex.classList.add('ex-drag');try{g.setPointerCapture(e.pointerId)}catch(x){}});
document.addEventListener('pointermove',e=>{if(!exDrag)return;const d=exDrag;d.ex.style.transform=`translateY(${e.clientY-d.y0}px)`;const others=d.list.filter(x=>x!==d.ex);let j=0;others.forEach(o=>{const r=o.getBoundingClientRect();if(e.clientY>r.top+r.height/2)j++});d.j=j;
  others.forEach((o,k)=>{o.classList.toggle('drop-before',k===j);o.classList.toggle('drop-after',j===others.length&&k===others.length-1)})});
function endExDrag(cancel){if(!exDrag)return;const d=exDrag;exDrag=null;d.list.forEach(o=>o.classList.remove('drop-before','drop-after'));d.ex.style.transform='';d.ex.classList.remove('ex-drag');
  if(!cancel&&d.j!==d.i){const arr=sess(d.sid).ex,[m]=arr.splice(d.i,1);arr.splice(d.j,0,m);render()}}
document.addEventListener('pointerup',()=>endExDrag(false));
document.addEventListener('pointercancel',()=>endExDrag(true));
function endDrag(e,cancel){if(!drag)return;clearTimeout(drag.timer);const d=drag;drag=null;if(!d.active)return;dragEnd=Date.now();if(d.col)d.col.classList.remove('hover');
  const c=!cancel&&colAt(e.clientX,e.clientY);d.el.style.transform='';d.el.style.pointerEvents='';d.el.classList.remove('dragging');
  if(c){const y=e.clientY-c.getBoundingClientRect().top-d.offY;moveOcc(d.id,d.from,c.dataset.col,Math.round((H0+y/HH*60)/15)*15)}}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.ev'))e.preventDefault()});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(!S.theme)applyTheme()});


/* ===== Synchronisation en temps réel (PC ↔ iPhone) =====
   Données privées du compte : data/users/<id>/app (cœur) + days/<date> + sessions/<id>.
   Le stockage local reste un cache : la page s’affiche tout de suite, puis se met à jour. */
var SYNC={base:null,remote:{},dirty:new Set(),timer:null,ready:false,pushing:false,again:false,pending:false};
const CORE_KEYS=['tasks','foods','bw','habits','tg','goals','guides','xlib'];
const SYNC_TXT={local:['Sur cet appareil uniquement',''],busy:['Synchronisation…','gold'],ok:['Synchronisé','ok'],err:['Hors ligne · modifications gardées ici','red'],slow:['Connexion lente · données locales','gold']};
function setSync(s){const el=$('#sync');if(!el)return;const[t,c]=SYNC_TXT[s];el.className='sync '+c;el.title=t;el.innerHTML=`<i></i><span class="lbl">${t}</span>`}
function syncParts(){const p={core:{}};CORE_KEYS.forEach(k=>p.core[k]=S[k]);
  Object.entries(S.logs).forEach(([d,l])=>{if(active(l)||l.title||l.rp||SYNC.remote['days/'+d]!==undefined)p['days/'+d]=l});
  S.sessions.forEach(z=>p['sessions/'+z.id]=z);
  const out={};Object.entries(p).forEach(([k,v])=>out[k]=JSON.stringify(v));return out}
const refOf=k=>{if(k=='core')return SYNC.base;const[c,id]=k.split('/');return SYNC.base.collection(c).doc(id)};
function syncMark(){if(!SYNC.ready)return;const p=syncParts();new Set([...Object.keys(p),...Object.keys(SYNC.remote)]).forEach(k=>{if((p[k]??null)!==(SYNC.remote[k]??null))SYNC.dirty.add(k);else SYNC.dirty.delete(k)});
  if(SYNC.dirty.size){setSync('busy');clearTimeout(SYNC.timer);SYNC.timer=setTimeout(syncPush,600)}}
async function syncPush(){if(SYNC.pushing){SYNC.again=true;return}SYNC.pushing=true;
  try{const p=syncParts();for(const k of[...SYNC.dirty]){const j=p[k]??null;
      if(j===null){await refOf(k).delete();delete SYNC.remote[k]}
      else{if(j.length>250000)toast('Données trop volumineuses pour la synchro : exporte une sauvegarde.');await refOf(k).set({json:j,t:Date.now()});SYNC.remote[k]=j}
      SYNC.dirty.delete(k)}
    setSync(SYNC.dirty.size?'busy':'ok')}
  catch(e){setSync('err');if(e&&e.code=='quota_exceeded')toast('Stockage en ligne plein : exporte une sauvegarde.');clearTimeout(SYNC.timer);SYNC.timer=setTimeout(syncPush,8000)}
  finally{SYNC.pushing=false;if(SYNC.again){SYNC.again=false;syncPush()}}}
function applyDoc(k,body){const j=body&&typeof body.json=='string'?body.json:null;if(j===(SYNC.remote[k]??null)||SYNC.dirty.has(k))return false;
  if(j===null)delete SYNC.remote[k];else SYNC.remote[k]=j;const v=j===null?undefined:JSON.parse(j);
  if(k=='core'){if(v)CORE_KEYS.forEach(x=>{if(v[x]!==undefined)S[x]=v[x]})}
  else{const[c,id]=k.split('/');if(c=='days'){if(v)S.logs[id]=v;else delete S.logs[id]}
    else{const i=S.sessions.findIndex(z=>z.id==id);if(v){if(i>=0)S.sessions[i]=v;else S.sessions.push(v)}else if(i>=0)S.sessions.splice(i,1)}}
  return true}
const editing=()=>{const a=document.activeElement;return!!(a&&a.closest&&a.closest('#app')&&a.matches('input,textarea,select'))};
function remoteChanged(){_fm=null;if(editing()){SYNC.pending=true;return}render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(SYNC.pending&&!editing()){SYNC.pending=false;render()}},0));
async function syncInit(){
  if(!window.claude||typeof window.claude.use!='function'){setSync('local');return}
  setSync('busy');const slow=setTimeout(()=>{if(!SYNC.ready)setSync('slow')},10000);
  try{
    const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);const id=user?await user.id():null;
    if(!db||!id){clearTimeout(slow);setSync('local');return}
    SYNC.base=db.doc('data/users/'+id+'/app');
    const[c,ds,ss]=await Promise.all([SYNC.base.get(),SYNC.base.collection('days').get(),SYNC.base.collection('sessions').get()]);
    if(c.exists){ /* un autre appareil a déjà synchronisé : ses données font foi */
      const cj=c.data().json;SYNC.remote.core=cj;const v=JSON.parse(cj);CORE_KEYS.forEach(x=>{if(v[x]!==undefined)S[x]=v[x]});
      ds.docs.forEach(d=>{const j=d.data().json;SYNC.remote['days/'+d.id]=j;S.logs[d.id]=JSON.parse(j)});
      S.sessions=ss.docs.map(d=>{const j=d.data().json;SYNC.remote['sessions/'+d.id]=j;return JSON.parse(j)});
      migrate();_fm=null}
    clearTimeout(slow);SYNC.ready=true;
    if(editing())SYNC.pending=true;else render(); /* render → save → envoie ce qui manque en ligne */
    if(!SYNC.dirty.size)setSync('ok');
    const err=()=>setSync('err');
    SYNC.base.onSnapshot(s=>{if(s.metadata.fromCache||s.metadata.hasPendingWrites)return;if(applyDoc('core',s.exists?s.data():null))remoteChanged()},err);
    ['days','sessions'].forEach(col=>SYNC.base.collection(col).onSnapshot(q=>{let ch=false;q.docChanges().forEach(x=>{const m=x.doc.metadata;if(m.fromCache||m.hasPendingWrites)return;if(applyDoc(col+'/'+x.doc.id,x.type=='removed'?null:x.doc.data()))ch=true});if(ch)remoteChanged()},err));
  }catch(e){clearTimeout(slow);setSync(SYNC.ready?'err':'local')}}

render();
setSync('local');syncInit();

</script>
